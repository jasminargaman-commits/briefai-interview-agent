[project]
name = "briefai"
version = "0.1.0"
description = "Interview agent that turns a client conversation into a structured website design brief."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "markdown>=3.11",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "vercel>=0.11.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
entrypoint = "briefai.web:app"
